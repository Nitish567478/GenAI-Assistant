<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI RAG Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <div class="new-chat-btn" id="new-chat">
            <span>+</span> New chat
        </div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="main-chat">
        <div id="chat-container" class="chat-container"></div>

        <div id="loading" class="dot-loading hidden">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="input-wrapper">
            <div class="input-container">
                <span class="emoji-btn" id="emoji-trigger">😊</span>
                <input type="text" id="user-input" placeholder="Message RAG Assistant..." autocomplete="off">
                <button id="send-btn">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
